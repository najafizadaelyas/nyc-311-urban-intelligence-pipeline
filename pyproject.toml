[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyc-311-pipeline"
version = "1.0.0"
description = "Production-grade NYC 311 Urban Intelligence Pipeline using Medallion Architecture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Data Engineering Team" }]
keywords = ["data-engineering", "dlt", "duckdb", "dbt", "polars", "dagster", "nyc-311"]

dependencies = [
    # ─── Ingestion ────────────────────────────────────────────────────────────
    "dlt[duckdb]==0.5.4",                   # Python-native ELT library (schema inference, incremental)
    "requests==2.32.3",                     # HTTP client for Socrata API
    "sodapy==2.2.0",                        # Socrata Open Data API Python client

    # ─── Storage / Compute ────────────────────────────────────────────────────
    "duckdb==1.1.3",                        # Embedded OLAP engine (all three layers)

    # ─── Cleaning ─────────────────────────────────────────────────────────────
    "polars==1.9.0",                        # Rust-powered DataFrame library (Bronze→Silver)
    "pyarrow==17.0.0",                      # Arrow IPC bridge (Polars ↔ DuckDB)

    # ─── Transformation ───────────────────────────────────────────────────────
    "dbt-core==1.8.7",                      # SQL-first transformation framework
    "dbt-duckdb==1.8.2",                    # dbt adapter for DuckDB

    # ─── Data Quality ─────────────────────────────────────────────────────────
    "great-expectations==0.18.19",          # Data contract validation and profiling

    # ─── Orchestration ────────────────────────────────────────────────────────
    "dagster==1.9.3",                       # Asset-based data orchestration
    "dagster-webserver==1.9.3",             # Dagster UI server
    "dagster-dbt==0.25.3",                  # Dagster ↔ dbt integration
    "dagster-duckdb==0.25.3",              # Dagster ↔ DuckDB resource

    # ─── Environment / Config ─────────────────────────────────────────────────
    "python-dotenv==1.0.1",                 # .env file loading
    "pydantic==2.9.2",                      # Settings validation (Dagster config, GE config)
    "pydantic-settings==2.5.2",            # Settings classes with env var binding

    # ─── Utilities ────────────────────────────────────────────────────────────
    "tenacity==9.0.0",                      # Retry logic for API calls
    "rich==13.8.1",                         # Beautiful CLI output
    "structlog==24.4.0",                    # Structured logging
    "pendulum==3.0.0",                      # Timezone-aware datetime handling
]

[project.optional-dependencies]
dev = [
    # ─── Testing ──────────────────────────────────────────────────────────────
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",

    # ─── Code Quality ─────────────────────────────────────────────────────────
    "ruff==0.6.9",                          # Fast Python linter + formatter (replaces flake8/black/isort)
    "mypy==1.11.2",                         # Static type checking

    # ─── Notebooks (exploration) ──────────────────────────────────────────────
    "jupyter==1.1.1",
    "jupyterlab==4.2.5",
]

[project.scripts]
ingest    = "ingestion.pipeline:main"
clean     = "clean.silver_cleaner:main"

[tool.hatch.envs.default]
features = ["dev"]

# ─── Ruff Configuration ───────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "ANN401",  # Any allowed in certain contexts
]

[tool.ruff.format]
quote-style = "double"

# ─── Mypy Configuration ───────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["transform/"]   # dbt project — not typed Python

# ─── Pytest Configuration ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=ingestion --cov=clean --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]
